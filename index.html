<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cairn">
  <meta name="description" content="Cairn by Highshore Studio — Kanban, docs, roadmap and whiteboards, offline in the browser.">
  <title>Cairn</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Animated background: fills the whole screen, also outside the 16:9 safe area. -->
  <div id="backdrop" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="grain"></div>
  </div>

  <!-- Everything interactive lives inside the stage: always 16:9, always inside the safe area. -->
  <div id="stage-wrap">
    <main id="stage">
      <div id="view"></div>
      <div id="layer"></div>
      <div id="toasts" aria-live="polite"></div>
    </main>
  </div>

  <div id="rotate-hint" aria-hidden="true">
    <div class="rotate-card glass">
      <div class="rotate-icon"></div>
      <b>Turn your phone sideways</b>
      <span>Cairn is laid out for landscape.</span>
    </div>
  </div>

  <noscript><p style="padding:2rem;color:#fff">Cairn needs JavaScript.</p></noscript>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/model.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-auth.js"></script>
  <script src="js/view-projects.js"></script>
  <script src="js/view-board.js"></script>
  <script src="js/view-card.js"></script>
  <script src="js/view-docs.js"></script>
  <script src="js/view-roadmap.js"></script>
  <script src="js/view-whiteboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
